<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Big Shizzy | Official Artist Profile</title>

<meta name="description"
content="Official profile of Big Shizzy (Toluwani) — artist, entertainer and creative professional from Ogun State, Nigeria.">

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #030303;
    color: #ffffff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    line-height: 1.7;

    overflow-x: hidden;
}

img {
    max-width: 100%;
    display: block;
}

/* ... rest of CSS unchanged ... */

/* =========================================================
   HERO IMAGE
========================================================= */

.hero-photo-wrap {

    position: relative;

    width: 100%;

    max-width: 480px;

    margin: auto;
}

.hero-photo-wrap::before {

    content: "";

    position: absolute;

    inset: -15px;

    border:
        1px solid
        rgba(212,175,55,.25);

    border-radius: 15px;

    animation:
        pulseBorder
        3s ease-in-out infinite;
}

@keyframes pulseBorder {

    0%,
    100% {
        transform: scale(1);

        opacity: .3;
    }

    50% {
        transform: scale(1.025);

        opacity: .8;
    }

}

.hero-photo {

    width: 100%;

    aspect-ratio: 4 / 5;

    object-fit: cover;
    object-position: center top;

    display: block;

    position: relative;

    border-radius: 12px;

    border:
        2px solid
        rgba(212,175,55,.6);

    box-shadow:

        0 0 50px
        rgba(212,175,55,.13),

        0 30px 80px
        rgba(0,0,0,.8);
}


/* =========================================================
   IMAGE LABEL
========================================================= */

.photo-label {

    position: absolute;

    bottom: 20px;
    left: 20px;
    right: 20px;

    padding:
        15px
        18px;

    border-radius: 7px;

    background:
        rgba(0,0,0,.75);

    backdrop-filter: blur(10px);

    border:
        1px solid
        rgba(212,175,55,.3);
}

.photo-label small {

    display: block;

    color: var(--gold);

    font-size: 10px;

    letter-spacing: 2px;

    text-transform: uppercase;
}

.photo-label strong {

    font-size: 20px;
}


/* =========================================================
   SECTION
========================================================= */

section {

    width: 100%;

    padding:
        110px
        25px;
}

.container {

    width: 100%;

    max-width: 1150px;

    margin: auto;
}

.section-heading {

    text-align: center;

    margin-bottom: 65px;
}

.section-heading small {

    color: var(--gold);

    font-size: 12px;

    font-weight: bold;

    letter-spacing: 4px;

    text-transform: uppercase;
}

.section-heading h2 {

    margin-top: 10px;

    font-size:
        clamp(
            38px,
            5vw,
            62px
        );

    line-height: 1.05;
}

.section-heading p {

    max-width: 700px;

    margin:
        18px
        auto
        0;

    color: var(--gray);
}


/* =========================================================
   BIOGRAPHY
========================================================= */

.biography {

    background:
        #080808;
}

.bio-grid {

    display: grid;

    grid-template-columns:
        .8fr
        1.2fr;

    gap: 65px;

    align-items: center;
}

.bio-image {

    position: relative;
}

.bio-image img {

    width: 100%;

    aspect-ratio: 4 / 5;

    object-fit: cover;
    object-position: center top;

    display: block;

    border-radius: 10px;

    border:
        1px solid
        rgba(212,175,55,.4);
}

.bio-content h3 {

    color: var(--gold);

    font-size: 32px;

    margin-bottom: 20px;
}

.bio-content p {

    color: #c3c3c3;

    margin-bottom: 20px;

    font-size: 16px;
}

.bio-signature {

    margin-top: 30px;

    color: var(--gold);

    font-size: 18px;

    font-weight: bold;

    font-style: italic;
}
